name: unidad3-dashboard
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ingresos_u3
      MYSQL_USER: ingresos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecuta python configurar.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta python configurar.py}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3313}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  mysql_data:
